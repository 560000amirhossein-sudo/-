<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NIGHT CHAT</title>
<style>
:root{--bg:#07050d;--pn:#100b19;--pn2:#171024;--bd:#2c2040;--pu:#a855f7;--pu2:#6d28d9;--tx:#f3eefc;--mu:#a49ab9;--gr:linear-gradient(135deg,#c084fc,#7c3aed 55%,#5b21b6)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Tahoma,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.app{display:flex;height:100%;max-width:1400px;margin:auto;border-inline:1px solid var(--bd)}
.side{width:360px;flex-shrink:0;background:var(--pn);border-inline-start:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:radial-gradient(ellipse at 20% 0,#3a176d44,transparent 55%),var(--bg)}
.top{display:flex;align-items:center;gap:10px;padding:12px 14px}
.brand{flex:1;font-weight:900;font-size:17px;letter-spacing:.5px;user-select:none}
.brand b{color:#c084fc}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px;color:var(--mu);transition:.2s}
.ib:hover{background:#ffffff12;color:#fff}
.sbox{margin:0 14px 10px;position:relative}
.sbox input{width:100%;padding:11px 40px;border-radius:14px;border:1px solid var(--bd);background:var(--pn2);outline:0}
.sbox input:focus{border-color:var(--pu)}
.sbox .ic{position:absolute;top:50%;transform:translateY(-50%);inset-inline-start:13px;color:var(--mu)}
.sbox .x{position:absolute;top:50%;transform:translateY(-50%);inset-inline-end:8px;color:var(--mu);display:none;padding:4px 8px}
.tabs{display:flex;gap:6px;padding:0 14px 10px;overflow-x:auto}
.tab{padding:7px 14px;border-radius:20px;font-size:12px;color:var(--mu);background:var(--pn2);white-space:nowrap;transition:.2s}
.tab.on{background:var(--gr);color:#fff}
.list{flex:1;overflow-y:auto;padding:0 8px 80px;position:relative}
.sec{padding:10px 8px 4px;color:#c084fc;font-size:11px}
.it{display:flex;align-items:center;gap:11px;padding:10px;border-radius:14px;cursor:pointer;transition:.15s;width:100%;text-align:start}
.it:hover,.it.on{background:#a855f71f}
.av{width:48px;height:48px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-weight:900;font-size:18px;color:#fff;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av.s{width:34px;height:34px;font-size:13px}
.im{flex:1;min-width:0}
.r1,.r2{display:flex;justify-content:space-between;gap:8px;align-items:center}
.nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm{font-size:11px;color:var(--mu);flex-shrink:0}
.lt{font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.bd{background:var(--gr);color:#fff;border-radius:12px;min-width:20px;padding:1px 6px;font-size:11px;text-align:center}
.empty{text-align:center;color:var(--mu);padding:50px 20px;font-size:13px;line-height:2}
.fab{position:absolute;bottom:18px;inset-inline-start:18px;display:flex;gap:8px;z-index:3}
.fab button{padding:12px 16px;border-radius:24px;background:var(--gr);color:#fff;font-weight:700;font-size:13px;box-shadow:0 8px 24px #7c3aed66}
.head{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--pn);border-bottom:1px solid var(--bd)}
.head .t{flex:1;min-width:0}
.head .s{font-size:11px;color:var(--mu)}
.back{display:none}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:flex-end;max-width:82%;animation:in .25s}
.row.me{align-self:flex-start}.row:not(.me){align-self:flex-end;flex-direction:row-reverse}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.bub{padding:9px 13px;border-radius:16px;background:var(--pn2);border:1px solid var(--bd);word-break:break-word;white-space:pre-wrap;line-height:1.8;font-size:14px}
.me .bub{background:linear-gradient(135deg,#7c3aed,#4c1d95);border-color:#a855f755}
.who{font-size:11px;color:#c084fc;font-weight:700;margin-bottom:2px}
.pic{display:block;max-width:100%;max-height:280px;border-radius:10px;margin-top:6px;cursor:zoom-in}
.mt{font-size:10px;color:#ffffff88;margin-top:3px;display:flex;gap:10px}
.del{color:#f87171;font-size:10px}
.comp{display:flex;align-items:flex-end;gap:6px;padding:10px 12px;background:var(--pn);border-top:1px solid var(--bd);position:relative}
.comp textarea{flex:1;resize:none;max-height:120px;padding:11px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--pn2);outline:0;line-height:1.6}
.send{background:var(--gr);color:#fff}
.joinbar{padding:14px;text-align:center;background:var(--pn);border-top:1px solid var(--bd);color:var(--mu);font-size:13px}
.joinbar button,.btn{padding:10px 22px;border-radius:12px;background:var(--gr);color:#fff;font-weight:700;margin-top:6px}
.btn.g{background:var(--pn2);border:1px solid var(--bd)}
.ph{flex:1;display:grid;place-items:center;color:var(--mu);text-align:center;padding:20px;line-height:2}
.emo{position:absolute;bottom:64px;inset-inline-start:12px;width:300px;max-width:90vw;background:var(--pn2);border:1px solid var(--bd);border-radius:16px;padding:8px;display:none;flex-wrap:wrap;gap:2px;z-index:5}
.emo.open{display:flex}.emo button{font-size:22px;width:38px;height:38px;border-radius:10px}.emo button:hover{background:#ffffff14}
.prev{display:none;align-items:center;gap:10px;padding:8px 14px;background:var(--pn);border-top:1px solid var(--bd);font-size:12px;color:#c4b5fd}
.prev.show{display:flex}.prev img{width:48px;height:48px;border-radius:8px;object-fit:cover}
.ov{position:fixed;inset:0;z-index:50;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.ov.open{display:flex}
.card{width:min(400px,100%);background:linear-gradient(145deg,#171020,#100b1c);border:1px solid var(--bd);border-radius:22px;padding:24px;box-shadow:0 25px 80px #000a;animation:in .25s}
.card h3{margin-bottom:14px;font-size:18px}
.card label{display:block;font-size:12px;color:var(--mu);margin:12px 0 5px}
.card input[type=text],.card input[type=email],.card input[type=password],.card textarea{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--bd);background:var(--pn2);outline:0}
.card .btn{width:100%;margin-top:14px}
.msg{color:#c4b5fd;font-size:12px;margin-top:10px;min-height:18px;line-height:1.8}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px}
#gate{background:radial-gradient(ellipse at 50% -10%,#492078aa,transparent 55%),var(--bg);z-index:100;display:flex;text-align:center}
#gate .logo{font-size:30px;font-weight:900;margin-bottom:6px;user-select:none}
#lb img{max-width:100%;max-height:100%;border-radius:12px}
@media(max-width:760px){
 .app{border:0}.side{width:100%;border:0}.main{display:none;width:100%}
 .app.open .side{display:none}.app.open .main{display:flex}.back{display:grid}
 .row{max-width:92%}
}
</style></head><body>
<div class="app" id="app">
 <aside class="side">
  <div class="top">
   <button class="av s" id="meAv" title="پروفایل"></button>
   <div class="brand" id="brand">NIGHT <b>CHAT</b></div>
  </div>
  <div class="sbox"><span class="ic">🔍</span><input id="q" placeholder="جست‌وجوی کاربران، گروه‌ها و کانال‌ها..." autocomplete="off"><button class="x" id="qx">✕</button></div>
  <div class="tabs" id="tabs">
   <button class="tab on" data-t="all">همه</button><button class="tab" data-t="private">خصوصی</button>
   <button class="tab" data-t="group">گروه‌ها</button><button class="tab" data-t="channel">کانال‌ها</button>
  </div>
  <div id="note" style="margin:0 14px 8px;padding:8px 12px;border-radius:12px;background:#a855f71a;color:#c4b5fd;font-size:11px;line-height:1.9">گروه عمومی بین همه مشترک است؛ گروه‌ها و کانال‌هایی که می‌سازی فقط روی همین دستگاه ذخیره می‌شوند.</div>
  <div class="list" id="list"></div>
  <div class="fab"><button id="newG">＋ گروه جدید</button><button id="newC">＋ کانال جدید</button></div>
 </aside>
 <main class="main">
  <div class="ph" id="ph">یک گفتگو را انتخاب کن<br>یا از جست‌وجو یک کاربر پیدا کن.</div>
  <div id="chat" style="display:none;flex-direction:column;flex:1;min-height:0">
   <div class="head">
    <button class="ib back" id="back">➜</button>
    <div class="av s" id="hAv"></div>
    <div class="t"><div class="nm" id="hNm"></div><div class="s" id="hSub"></div></div>
    <button class="ib" id="info" title="اطلاعات">ⓘ</button>
   </div>
   <div class="msgs" id="msgs"></div>
   <div class="prev" id="prev"><img id="prevImg" alt=""><span style="flex:1">عکس آماده ارسال</span><button class="ib" id="prevX">✕</button></div>
   <div class="comp" id="comp">
    <div class="emo" id="emo"></div>
    <button class="ib" id="emoB">😊</button>
    <button class="ib" id="attB" title="پیوست عکس">📎</button>
    <input type="file" id="file" accept="image/*" hidden>
    <textarea id="txt" rows="1" maxlength="1000" placeholder="پیام بنویس..."></textarea>
    <button class="ib send" id="sendB">➤</button>
   </div>
   <div class="joinbar" id="joinbar" style="display:none"></div>
  </div>
 </main>
</div>
<div class="ov" id="md"><div class="card" id="mdBody"></div></div>
<div class="ov" id="lb" style="cursor:zoom-out"><img id="lbImg" alt=""></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const sb=createClient("https://jpsttfuajyfvysqydqqj.supabase.co","sb_publishable_D_D03bZTtXlKxPgz74MYfQ_Vvpmjn3x",{auth:{persistSession:false,autoRefreshToken:false}});
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LSK="nc_new_v1",DEF="public",TL={private:"خصوصی",group:"گروه",channel:"کانال"};
let D;try{D=JSON.parse(localStorage.getItem(LSK));}catch{}
D=D||{me:{name:"مهمان"+(1000+Math.floor(Math.random()*9000)),avatar:null},chats:[],msgs:{},seen:""};
if(!D.chats.some(c=>c.id===DEF))D.chats.unshift({id:DEF,type:"group",title:"NIGHT CHAT عمومی",desc:"گروه عمومی همه‌ی اعضا",role:"member",pub:true});
const save=()=>{try{localStorage.setItem(LSK,JSON.stringify(D));}catch{alert("حافظه‌ی مرورگر پر شد.");}};save();
let cur=null,tab="all",query="",pending=null,pubMsgs=[],pubErr=false,sig="";
const safe=u=>typeof u==="string"&&u.startsWith("data:image/")?u:"";
const hue=n=>{let h=0;for(const c of String(n||""))h=(h*31+c.charCodeAt(0))%360;return h;};
function avHtml(url,name,cls=""){const u=safe(url);return `<div class="av ${cls}" style="${u?"":`background:hsl(${hue(name)} 55% 42%)`}">${u?`<img src="${u}" alt="">`:esc([...String(name||"?")][0])}</div>`;}
function setAv(el,url,name){const u=safe(url);el.style.background=u?"":`hsl(${hue(name)} 55% 42%)`;el.innerHTML=u?`<img src="${u}" alt="">`:esc([...String(name||"?")][0]);}
const fmt=t=>{if(!t)return"";const d=new Date(t),n=new Date();return d.toDateString()===n.toDateString()?d.toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"}):d.toLocaleDateString("fa-IR",{month:"short",day:"numeric"});};
const b2d=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b);});
function resize(file,max,square){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{let sx=0,sy=0,sw=i.width,sh=i.height,w,h;if(square){const s=Math.min(sw,sh);sx=(sw-s)/2;sy=(sh-s)/2;sw=sh=s;w=h=max;}else{const r=Math.min(1,max/Math.max(sw,sh));w=Math.round(sw*r);h=Math.round(sh*r);}const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#0a0811";x.fillRect(0,0,w,h);x.drawImage(i,sx,sy,sw,sh,0,0,w,h);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(),"image/jpeg",.8);};i.onerror=no;i.src=u;});}

// ---- داده ----
function view(){return D.chats.map(c=>{
 if(c.id===DEF){const l=pubMsgs[pubMsgs.length-1];return{...c,last:l?.text,at:l?.created_at||"",unread:pubMsgs.filter(m=>m.created_at>D.seen&&m.name!==D.me.name).length};}
 return{...c,unread:0,at:c.at||""};}).sort((a,b)=>String(b.at).localeCompare(String(a.at)));}
function msgsOf(c){
 if(c.id===DEF)return pubMsgs.map(m=>({id:m.id,text:m.text,img:null,at:m.created_at,mine:m.name===D.me.name,name:m.name}));
 return(D.msgs[c.id]||[]).map(m=>({...m,mine:true,name:D.me.name,avatar:D.me.avatar}));}
async function pull(){
 const r=await sb.from("messages").select("id,name,text,created_at").order("created_at",{ascending:true}).limit(100);
 pubErr=!!r.error;if(!r.error)pubMsgs=r.data;
}
const canPost=()=>cur&&(cur.type!=="channel"||cur.role==="owner");

// ---- فهرست ----
function itemHtml(c){return `<button class="it ${cur&&cur.id===c.id?"on":""}" data-id="${c.id}">${avHtml(c.avatar,c.title)}<div class="im"><div class="r1"><span class="nm">${esc(c.title)}</span><span class="tm">${fmt(c.at)}</span></div><div class="r2"><span class="lt">${c.img&&!c.last?"🖼️ عکس":esc(c.last||c.desc||"بدون پیام")}</span>${c.unread?`<span class="bd">${c.unread>99?"99+":c.unread}</span>`:""}</div></div></button>`;}
function renderList(){
 const L=$("list");$("qx").style.display=query?"block":"none";
 $("newG").style.display=tab==="channel"||tab==="private"?"none":"";$("newC").style.display=tab==="group"||tab==="private"?"none":"";
 let rows=view();
 if(query)rows=rows.filter(c=>c.title.toLowerCase().includes(query.toLowerCase()));else rows=rows.filter(c=>tab==="all"||c.type===tab);
 let h=rows.map(itemHtml).join("");
 if(!rows.length)h=`<div class="empty">${query?"نتیجه‌ای پیدا نشد.":tab==="private"?"گفتگوی خصوصی بعد از راه‌اندازی حساب کاربری فعال می‌شود.":tab==="group"?"گروهی نداری.<br>با «گروه جدید» یکی بساز.":tab==="channel"?"کانالی نداری.<br>با «کانال جدید» یکی بساز.":"گفتگویی وجود ندارد."}</div>`;
 L.innerHTML=h;L.querySelectorAll(".it").forEach(b=>b.onclick=()=>openChat(b.dataset.id));
}
$("q").oninput=()=>{query=$("q").value.trim();renderList();};
$("qx").onclick=()=>{$("q").value="";query="";renderList();};
$("tabs").onclick=e=>{const b=e.target.closest(".tab");if(!b)return;tab=b.dataset.t;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));renderList();};

// ---- گفتگو ----
function openChat(id){
 const c=view().find(x=>x.id===id);if(!c)return;cur=c;sig="";
 $("ph").style.display="none";$("chat").style.display="flex";$("app").classList.add("open");
 setAv($("hAv"),c.avatar,c.title);$("hNm").textContent=c.title;
 $("hSub").textContent=id===DEF&&pubErr?"اتصال برقرار نیست":TL[c.type]+(c.pub===false?" خصوصی":" عمومی");
 const p=canPost();$("comp").style.display=p?"flex":"none";$("joinbar").style.display=p?"none":"block";$("joinbar").textContent="فقط مدیر کانال می‌تواند پیام ارسال کند.";
 if(id===DEF&&pubMsgs.length){D.seen=pubMsgs[pubMsgs.length-1].created_at;save();}
 renderMsgs(true);renderList();
}
function renderMsgs(force){
 if(!cur)return;const data=msgsOf(cur),s=cur.id+data.map(m=>m.id).join();if(s===sig&&!force)return;sig=s;
 const box=$("msgs"),near=box.scrollHeight-box.scrollTop-box.clientHeight<120||force;
 box.innerHTML=data.length?"":`<div class="empty">هنوز پیامی نیست. اولین نفر باش! 👋</div>`;
 for(const m of data){
  const img=safe(m.img),r=document.createElement("div");r.className="row"+(m.mine?" me":"");
  r.innerHTML=(m.mine||cur.type!=="group"?"":avHtml(m.avatar,m.name,"s"))+`<div class="bub">${m.mine||cur.type!=="group"?"":`<div class="who">${esc(m.name)}</div>`}${m.text?esc(m.text):""}${img?`<img class="pic" src="${img}" alt="">`:""}<div class="mt"><span>${fmt(m.at)}</span>${cur.id!==DEF?`<button class="del">حذف</button>`:""}</div></div>`;
  const pic=r.querySelector(".pic");if(pic)pic.onclick=()=>{$("lbImg").src=img;$("lb").classList.add("open");};
  const d=r.querySelector(".del");if(d)d.onclick=()=>{if(!confirm("این پیام حذف شود؟"))return;D.msgs[cur.id]=(D.msgs[cur.id]||[]).filter(z=>z.id!==m.id);save();renderMsgs(true);renderList();};
  box.appendChild(r);
 }
 if(near)box.scrollTop=box.scrollHeight;
}
$("lb").onclick=()=>$("lb").classList.remove("open");
$("back").onclick=()=>{$("app").classList.remove("open");cur=null;$("chat").style.display="none";$("ph").style.display="grid";renderList();};

// ---- ارسال ----
async function send(){
 const text=$("txt").value.trim();if((!text&&!pending)||!canPost())return;
 $("sendB").disabled=true;
 try{
  if(cur.id===DEF){
   if(pending){alert("ارسال عکس در گروه عمومی فعلاً ممکن نیست.");$("sendB").disabled=false;return;}
   const {error}=await sb.from("messages").insert({name:D.me.name,text});if(error)throw error;await pull();
   D.seen=pubMsgs[pubMsgs.length-1]?.created_at||D.seen;
  }else{
   const m={id:"m"+Date.now(),text,img:pending?await b2d(pending):null,at:new Date().toISOString()};
   (D.msgs[cur.id]=D.msgs[cur.id]||[]).push(m);
   const c=D.chats.find(x=>x.id===cur.id);c.last=text;c.img=!!m.img;c.at=m.at;
  }
  save();$("txt").value="";$("txt").style.height="";pending=null;$("prev").classList.remove("show");
  renderMsgs(true);renderList();
 }catch(e){console.error(e);alert("ارسال ناموفق بود.");}
 $("sendB").disabled=false;
}
$("sendB").onclick=send;
$("txt").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&matchMedia("(min-width:761px)").matches){e.preventDefault();send();}};
$("txt").oninput=()=>{$("txt").style.height="auto";$("txt").style.height=Math.min($("txt").scrollHeight,120)+"px";};
$("attB").onclick=()=>$("file").click();
$("file").onchange=async()=>{const f=$("file").files[0];$("file").value="";if(!f||!f.type.startsWith("image/"))return;try{pending=await resize(f,640,false);$("prevImg").src=URL.createObjectURL(pending);$("prev").classList.add("show");}catch{alert("عکس قابل خواندن نبود.");}};
$("prevX").onclick=()=>{pending=null;$("prev").classList.remove("show");};
const EM="😀 😂 🥹 😍 😎 🤩 😭 😡 🥳 😴 🤔 👍 👎 👏 🙏 💜 🔥 ✨ 🎮 🕹️ 👾 🏆 ⚔️ 🛡️ 💀 👑 🌙 ⭐ 💯 🎉 ❤️ 😅 🤝 👀 🫡".split(" ");
$("emo").innerHTML=EM.map(e=>`<button>${e}</button>`).join("");
$("emo").onclick=e=>{if(e.target.tagName==="BUTTON"){$("txt").value+=e.target.textContent;$("txt").focus();}};
$("emoB").onclick=()=>$("emo").classList.toggle("open");

// ---- پنجره‌ها ----
const modal=h=>{$("mdBody").innerHTML=h;$("md").classList.add("open");},close=()=>$("md").classList.remove("open");
$("md").onclick=e=>{if(e.target===$("md"))close();};
function newChat(kind){
 let av=null;
 modal(`<h3>${kind==="group"?"گروه جدید":"کانال جدید"}</h3><label>نام</label><input type="text" id="nN" maxlength="60"><label>توضیحات</label><textarea id="nD" rows="2" maxlength="300"></textarea><label>تصویر</label><input type="file" id="nF" accept="image/*"><label class="chk"><input type="checkbox" id="nP" checked> عمومی</label><button class="btn" id="nGo">ساخت</button><div class="msg" id="nM"></div>`);
 $("nF").onchange=async()=>{const f=$("nF").files[0];if(f)try{av=await b2d(await resize(f,200,true));}catch{}};
 $("nGo").onclick=()=>{const t=$("nN").value.trim();if(!t){$("nM").textContent="نام را وارد کن.";return;}
  const id="l"+Date.now();D.chats.push({id,type:kind,title:t,desc:$("nD").value.trim()||null,avatar:av,pub:$("nP").checked,role:"owner",at:new Date().toISOString()});
  save();close();openChat(id);};
}
$("newG").onclick=()=>newChat("group");$("newC").onclick=()=>newChat("channel");
$("info").onclick=()=>{if(!cur)return;
 modal(`<h3>${esc(cur.title)}</h3><p style="color:var(--mu);font-size:13px;line-height:2">${TL[cur.type]}${cur.desc?`<br>${esc(cur.desc)}`:""}<br>نقش تو: ${cur.role==="owner"?"مالک":"عضو"}</p>${cur.id!==DEF?`<button class="btn g" id="lv">حذف ${TL[cur.type]} از این دستگاه</button>`:""}`);
 if($("lv"))$("lv").onclick=()=>{if(!confirm("حذف شود؟"))return;D.chats=D.chats.filter(c=>c.id!==cur.id);delete D.msgs[cur.id];save();close();$("back").click();};
};
function setMe(){setAv($("meAv"),D.me.avatar,D.me.name);}
$("meAv").onclick=()=>{
 modal(`<h3>پروفایل من</h3><div style="display:flex;justify-content:center;margin-bottom:6px" id="pAv">${avHtml(D.me.avatar,D.me.name)}</div><label>نام نمایشی</label><input type="text" id="pN" maxlength="30" value="${esc(D.me.name)}"><label>عکس پروفایل</label><input type="file" id="pF" accept="image/*"><button class="btn" id="pS">ذخیره</button>`);
 let nb=null;$("pF").onchange=async()=>{const f=$("pF").files[0];if(f)try{nb=await b2d(await resize(f,200,true));$("pAv").innerHTML=avHtml(nb,"");}catch{}};
 $("pS").onclick=()=>{const n=$("pN").value.trim();if(!n)return;D.me.name=n;if(nb)D.me.avatar=nb;save();setMe();close();renderMsgs(true);renderList();};
};

setMe();renderList();
pull().then(()=>{renderList();if(matchMedia("(min-width:761px)").matches)openChat(DEF);});
setInterval(async()=>{if(document.hidden)return;await pull();if(cur&&cur.id===DEF){if(pubMsgs.length){D.seen=pubMsgs[pubMsgs.length-1].created_at;}renderMsgs();}renderList();},4000);
</script></body></html>
