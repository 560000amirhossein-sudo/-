<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIGHT CHAT | چت گیمری</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Tahoma, Arial, sans-serif;
  background: #080b12;
  color: #f2f5ff;
}
header { text-align: center; padding: 28px 16px 18px; }
.logo { font-size: 28px; font-weight: bold; letter-spacing: 2px; color: #a78bfa; }
header p { color: #9aa7c2; margin-top: 8px; }
main { width: min(760px, 94%); margin: 0 auto; }
.panel {
  background: #111827;
  border: 1px solid #263249;
  border-radius: 14px;
  padding: 18px;
  margin: 14px 0;
}
h3 { margin: 0 0 14px; font-size: 17px; }
input, textarea {
  display: block; width: 100%; border: 1px solid #34415b;
  border-radius: 9px; padding: 12px; background: #0b1220;
  color: #f2f5ff; font: inherit; outline: none;
}
input:focus, textarea:focus { border-color: #8b5cf6; }
button {
  border: 0; border-radius: 9px; padding: 11px 15px;
  background: #8b5cf6; color: white; font: inherit;
  cursor: pointer; margin-top: 10px; transition: opacity .15s;
}
button:disabled { opacity: .45; cursor: not-allowed; }
button.secondary { background: #273449; }
#status { color: #aebbd3; font-size: 13px; line-height: 1.8; overflow-wrap: anywhere; }
#messages {
  display: flex; flex-direction: column; gap: 10px;
  max-height: 380px; overflow-y: auto; overflow-wrap: anywhere;
}
.message { background: #0b1220; border: 1px solid #263249; border-radius: 10px; padding: 12px; }
.message .name { color: #c4b5fd; font-weight: bold; margin-bottom: 6px; }
.message .body { white-space: pre-wrap; line-height: 1.7; }
.message .time { color: #7e8ba8; font-size: 10px; margin-top: 7px; }
.composer textarea { resize: vertical; min-height: 75px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row button { flex: 1; }
footer { text-align: center; color: #64708b; font-size: 12px; padding: 20px; }
</style>
</head>
<body>
<header>
  <div class="logo">NIGHT CHAT</div>
  <p>یک اتاق عمومی برای گیمرها</p>
</header>
<main>
  <section class="panel">
    <h3>👤 اسم مستعار تو</h3>
    <input id="nickname" maxlength="20" placeholder="مثلاً ZombieKiller">
    <button id="saveName">ثبت اسم</button>
    <p id="status">در حال اتصال به چت...</p>
  </section>
  <section class="panel">
    <h3>💬 چت عمومی</h3>
    <div id="messages"><p>در حال دریافت پیام‌ها...</p></div>
  </section>
  <section class="panel composer">
    <h3>✍️ پیام جدید</h3>
    <textarea id="messageInput" maxlength="500" placeholder="پیامت رو بنویس..."></textarea>
    <div class="row">
      <button id="sendButton" disabled>ارسال پیام 🚀</button>
      <button class="secondary" id="clearInput">پاک کردن متن</button>
    </div>
  </section>
</main>
<footer>NIGHT CHAT — ساخته‌شده برای گیمرها 🎮</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, addDoc, onSnapshot, query, orderBy, limit, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCG_xTcYnddaB-5lmzoaZ9tdHaLRfa3Wq8",
  authDomain: "chat-b8e03.firebaseapp.com",
  projectId: "chat-b8e03",
  storageBucket: "chat-b8e03.firebasestorage.app",
  messagingSenderId: "955243619912",
  appId: "1:955243619912:web:7763dfcb887bebd4109a7d"
};

const status = document.getElementById("status");
const nickname = document.getElementById("nickname");
const messageInput = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const messages = document.getElementById("messages");
const saveNameButton = document.getElementById("saveName");
const clearButton = document.getElementById("clearInput");

let db = null;
let currentUser = null;
let sending = false;
let connected = false;

try {
  nickname.value = localStorage.getItem("nightChatName") || "";
} catch (_) {}

saveNameButton.addEventListener("click", () => {
  const name = nickname.value.trim();
  if (!name || name.length > 20) {
    alert("یک اسم بین ۱ تا ۲۰ حرف وارد کن.");
    return;
  }
  try { localStorage.setItem("nightChatName", name); } catch (_) {}
  nickname.value = name;
  status.textContent = connected
    ? "✅ وصل شدی! اسم ذخیره شد؛ می‌تونی پیام بدی."
    : "اسم ذخیره شد؛ هنوز اتصال کامل نشده.";
});

nickname.addEventListener("change", () => {
  const name = nickname.value.trim();
  if (name && name.length <= 20) {
    try { localStorage.setItem("nightChatName", name); } catch (_) {}
  }
});

clearButton.addEventListener("click", () => { messageInput.value = ""; });

function showMessage(data) {
  const box = document.createElement("div");
  box.className = "message";
  const name = document.createElement("div");
  name.className = "name";
  name.textContent = data.name || "گیمر";
  const body = document.createElement("div");
  body.className = "body";
  body.textContent = data.text || "";
  const time = document.createElement("div");
  time.className = "time";
  if (data.createdAt && typeof data.createdAt.toDate === "function") {
    time.textContent = data.createdAt.toDate().toLocaleTimeString("fa-IR");
  } else {
    time.textContent = "در حال ثبت زمان...";
  }
  box.append(name, body, time);
  return box;
}

function errorDetails(error) {
  const code = error && error.code ? error.code : "unknown";
  const message = error && error.message ? error.message : "خطای نامشخص";
  return code + " — " + message;
}

async function startChat() {
  try {
    status.textContent = "در حال ورود ناشناس...";
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    db = getFirestore(app);
    const credential = await signInAnonymously(auth);
    currentUser = credential.user;
    connected = true;
    sendButton.disabled = false;
    status.textContent = "✅ وصل شدی! حالا می‌تونی پیام بدی.";

    const messagesQuery = query(
      collection(db, "messages"),
      orderBy("createdAt", "asc"),
      limit(100)
    );

    onSnapshot(messagesQuery, (snapshot) => {
      messages.replaceChildren();
      if (snapshot.empty) {
        const empty = document.createElement("p");
        empty.textContent = "هنوز پیامی نیست؛ اولین پیام رو بفرست!";
        messages.appendChild(empty);
        return;
      }
      snapshot.forEach((item) => messages.appendChild(showMessage(item.data())));
      messages.scrollTop = messages.scrollHeight;
    }, (error) => {
      console.error("Firestore read error:", error);
      status.textContent = "خطا در دریافت پیام‌ها: " + errorDetails(error);
    });
  } catch (error) {
    console.error("Chat connection error:", error);
    connected = false;
    sendButton.disabled = true;
    status.textContent = "اتصال ناموفق: " + errorDetails(error);
  }
}

async function sendMessage() {
  if (!currentUser || !db) {
    status.textContent = "هنوز به چت وصل نشدی؛ چند لحظه صبر کن.";
    return;
  }
  if (sending) return;

  const name = nickname.value.trim();
  const text = messageInput.value.trim();

  if (!name || name.length > 20) {
    alert("اول یک اسم مستعار بین ۱ تا ۲۰ حرف وارد کن.");
    nickname.focus();
    return;
  }
  if (!text || text.length > 500) {
    alert("پیام باید بین ۱ تا ۵۰۰ حرف باشد.");
    messageInput.focus();
    return;
  }

  try { localStorage.setItem("nightChatName", name); } catch (_) {}
  sending = true;
  sendButton.disabled = true;
  sendButton.textContent = "در حال ارسال...";

  // If Firebase stalls on a poor connection, release the button and show a useful error.
  let timeoutId;
  try {
    const sendPromise = addDoc(collection(db, "messages"), {
      name,
      text,
      uid: currentUser.uid,
      createdAt: serverTimestamp()
    });
    const timeoutPromise = new Promise((_, reject) => {
      timeoutId = setTimeout(() => {
        const timeoutError = new Error("ارسال بیش از ۱۵ ثانیه طول کشید؛ اتصال اینترنت یا Firebase را بررسی کن.");
        timeoutError.code = "send-timeout";
        reject(timeoutError);
      }, 15000);
    });
    await Promise.race([sendPromise, timeoutPromise]);
    messageInput.value = "";
    status.textContent = "✅ پیام ارسال شد.";
  } catch (error) {
    console.error("Message send error:", error);
    status.textContent = "❌ ارسال نشد: " + errorDetails(error);
    alert("پیام ارسال نشد.\n" + errorDetails(error) + "\nمتن پیام پاک نشده؛ دوباره تلاش کن.");
  } finally {
    if (timeoutId) clearTimeout(timeoutId);
    sending = false;
    sendButton.disabled = !connected;
    sendButton.textContent = "ارسال پیام 🚀";
  }
}

sendButton.addEventListener("click", sendMessage);
messageInput.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

startChat();
</script>
</body>
</html>
