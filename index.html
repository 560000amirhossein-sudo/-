```html
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NIGHT CHAT</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b12;color:#f2f5ff;font-family:Tahoma,Arial,sans-serif}
header{text-align:center;padding:25px}
.logo{font-size:30px;color:#a78bfa;font-weight:bold}
main{max-width:760px;width:94%;margin:auto}
.panel{background:#111827;border:1px solid #263249;border-radius:14px;padding:18px;margin:14px 0}
input,textarea{width:100%;padding:12px;border:1px solid #34415b;border-radius:9px;background:#0b1220;color:white;font:inherit}
textarea{min-height:75px}
button{padding:11px 15px;margin-top:10px;border:0;border-radius:9px;background:#8b5cf6;color:white;font:inherit;cursor:pointer}
button:disabled{opacity:.5}
#status{font-size:13px;line-height:1.8;color:#c4b5fd;overflow-wrap:anywhere}
#messages{max-height:380px;overflow:auto}
.message{background:#0b1220;border:1px solid #263249;border-radius:10px;padding:12px;margin:9px 0;overflow-wrap:anywhere}
.name{color:#c4b5fd;font-weight:bold;margin-bottom:6px}
.body{white-space:pre-wrap;line-height:1.7}
.time{color:#7e8ba8;font-size:11px;margin-top:7px}
</style>
</head>
<body>
<header>
<div class="logo">NIGHT CHAT</div>
<p>اتاق عمومی گیمرها 🎮</p>
</header>
<main>
<section class="panel">
<h3>👤 اسم مستعار</h3>
<input id="nickname" maxlength="20" placeholder="مثلاً Gamer123">
<button id="saveName">ثبت اسم</button>
<p id="status">در حال اتصال...</p>
</section>
<section class="panel">
<h3>💬 پیام‌های عمومی</h3>
<div id="messages">در حال دریافت پیام‌ها...</div>
</section>
<section class="panel">
<h3>✍️ پیام جدید</h3>
<textarea id="messageInput" maxlength="500" placeholder="پیامت رو بنویس..."></textarea>
<button id="sendButton" disabled>ارسال پیام 🚀</button>
<button id="clearButton" style="background:#273449">پاک کردن متن</button>
</section>
</main>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL = "https://jpsttfuajyfvysqydqqj.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_D_D03bZTtXlKxPgz74MYfQ_Vvpmjn3x";

const statusEl = document.getElementById("status");
const nickname = document.getElementById("nickname");
const messageInput = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const messages = document.getElementById("messages");

let supabase;
let sending = false;

try {
  nickname.value = localStorage.getItem("nightChatName") || "";
} catch (e) {}

document.getElementById("saveName").onclick = () => {
  const name = nickname.value.trim();
  if (!name) {
    alert("اول یک اسم وارد کن.");
    return;
  }
  try { localStorage.setItem("nightChatName", name); } catch (e) {}
  statusEl.textContent = "اسم ذخیره شد.";
};

document.getElementById("clearButton").onclick = () => {
  messageInput.value = "";
};

function renderMessage(item) {
  const box = document.createElement("div");
  box.className = "message";

  const name = document.createElement("div");
  name.className = "name";
  name.textContent = item.name || "گیمر";

  const body = document.createElement("div");
  body.className = "body";
  body.textContent = item.text || "";

  const time = document.createElement("div");
  time.className = "time";
  time.textContent = item.created_at
    ? new Date(item.created_at).toLocaleTimeString("fa-IR")
    : "";

  box.append(name, body, time);
  return box;
}

async function loadMessages() {
  const { data, error } = await supabase
    .from("messages")
    .select("id,name,text,created_at")
    .order("created_at", { ascending: true })
    .limit(100);

  if (error) {
    statusEl.textContent = "خطای دریافت پیام: " + error.message;
    return;
  }

  messages.replaceChildren();

  if (!data || data.length === 0) {
    messages.textContent = "هنوز پیامی نیست؛ اولین پیام رو بفرست!";
    return;
  }

  data.forEach(item => messages.appendChild(renderMessage(item)));
  messages.scrollTop = messages.scrollHeight;
}

async function sendMessage() {
  if (sending) return;

  const name = nickname.value.trim();
  const text = messageInput.value.trim();

  if (!name) {
    alert("اول اسم مستعار رو وارد کن.");
    return;
  }
  if (!text) {
    alert("اول پیام رو بنویس.");
    return;
  }

  sending = true;
  sendButton.disabled = true;
  statusEl.textContent = "در حال ارسال پیام...";

  try {
    const { error } = await supabase
      .from("messages")
      .insert({ name, text });

    if (error) throw error;

    try { localStorage.setItem("nightChatName", name); } catch (e) {}
    messageInput.value = "";
    statusEl.textContent = "پیام با موفقیت ذخیره شد.";
    await loadMessages();
  } catch (error) {
    statusEl.textContent = "خطای ارسال: " + error.message;
  } finally {
    sending = false;
    sendButton.disabled = false;
  }
}

sendButton.onclick = sendMessage;

messageInput.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

async function startChat() {
  if (SUPABASE_PUBLISHABLE_KEY === "کلید_Publishable_خودت_را_اینجا_قرار_بده") {
    statusEl.textContent = "کلید Publishable هنوز وارد نشده است.";
    return;
  }

  try {
    supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    await loadMessages();
    sendButton.disabled = false;
    statusEl.textContent = "اتصال برقرار شد.";
    setInterval(loadMessages, 5000);
  } catch (error) {
    statusEl.textContent = "خطای اتصال: " + error.message;
  }
}

startChat();
</script>
</body>
</html>
